name: Quality

# Fast repo-wide Biome lint, core package tests, and full Canvas quality gates
# (typecheck, dead-code check, renderer module structure, contract snapshot,
# harness tool typechecks, build, unit + governance tests, and Linux visual
# regression) on every PR.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install lint dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint repository with Biome
        run: pnpm run lint

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The engine grep tool shells out to ripgrep, which the runner image lacks.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Package tests import sibling packages through their dist/ output.
      - name: Build workspace packages
        run: pnpm run build:core

      - name: Test core packages
        run: pnpm run test:core

  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The engine grep tool shells out to ripgrep, which the runner image lacks.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary
        run: pnpm --filter canvas-workspace setup:electron

      # canvas-workspace resolves engine, storage and agent-teams through
      # their dist/ output.
      - name: Build workspace packages
        run: pnpm run build:core

      - name: Typecheck Canvas
        run: pnpm --filter canvas-workspace typecheck

      - name: Typecheck Canvas harness tools
        run: |
          pnpm --filter canvas-workspace exec tsc --noEmit -p harness/tools/ui-showcase/tsconfig.json
          pnpm --filter canvas-workspace exec tsc --noEmit -p harness/tools/feishu-replay/tsconfig.json

      # knip fails on unused files, exports and types in Canvas.
      - name: Check Canvas dead code
        run: pnpm --filter canvas-workspace deadcode

      - name: Check Canvas renderer structure
        run: node apps/canvas-workspace/harness/skills/check-renderer-structure/scripts/check-renderer-structure.mjs --strict

      - name: Check Canvas registry contracts
        run: node apps/canvas-workspace/harness/tools/describe-canvas.mjs

      - name: Build Canvas
        run: pnpm --filter canvas-workspace build

      - name: Test Canvas with coverage
        run: pnpm --filter canvas-workspace test:coverage

      - name: Run Feishu replay test
        run: pnpm --filter canvas-workspace exec vitest run harness/tools/feishu-replay/replay.test.ts

      - name: Upload Canvas coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-coverage-summary
          path: apps/canvas-workspace/coverage/coverage-summary.json
          if-no-files-found: warn

  canvas-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm --filter canvas-workspace exec playwright install --with-deps chromium

      - name: Run Canvas UI showcase visual regression
        run: pnpm --filter canvas-workspace visual

      - name: Upload visual diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-visual-diff
          path: apps/canvas-workspace/test-results/
          if-no-files-found: ignore
