# Deploy Pulse Canvas Web/H5 static bundle (`apps/canvas-workspace/dist/web`) to Cloudflare Pages.
# Reuses existing repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Publishes to a dedicated Pages project (`pulse-canvas-web`) so it never touches the desktop download site.

name: Deploy Pulse Canvas Web

on:
  push:
    branches:
      - master
    paths:
      - 'apps/canvas-workspace/src/renderer/**'
      - 'apps/canvas-workspace/src/shared/**'
      - 'apps/canvas-workspace/vite.web.config.ts'
      - 'apps/canvas-workspace/package.json'
      - 'apps/vps-daemon/**'
      - 'packages/storage/**'
      - '.github/workflows/canvas-web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build storage, vps-daemon, and Web/H5 bundle
        run: |
          pnpm --filter @pulse-coder/storage build
          pnpm --filter @pulse-coder/vps-daemon build
          pnpm --filter canvas-workspace build:web
          mkdir -p apps/canvas-workspace/dist/web/daemon
          cp apps/vps-daemon/dist/index.cjs apps/canvas-workspace/dist/web/daemon/index.cjs
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const buf = fs.readFileSync("apps/canvas-workspace/dist/web/daemon/index.cjs");
            const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
            const manifest = {
              sha256,
              bundleHash: sha256.slice(0, 16),
              bytes: buf.length,
              updatedAt: new Date().toISOString(),
              url: "https://pulse-canvas-web.pages.dev/daemon/index.cjs",
            };
            fs.writeFileSync(
              "apps/canvas-workspace/dist/web/daemon/latest.json",
              JSON.stringify(manifest, null, 2) + "\n",
            );
          '

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: pulse-canvas-web
        run: |
          wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true
          wrangler pages deploy apps/canvas-workspace/dist/web \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-dirty=true
