name: Canvas Release

# Manual Pulse Canvas release on an Apple Silicon runner. It runs the same
# script as a local release (apps/canvas-workspace/harness/skills/
# pulse-canvas-release): bump the app version, package the macOS arm64 DMG,
# upload to R2, update latest.json, deploy the download page. It then commits
# the version bump on the runner and pushes only the pulse-canvas-v<version>
# tag. No branch and no PR: the tag keeps the release commit reachable, and
# master keeps its old package.json version.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# PULSE_CANVAS_R2_BUCKET, PULSE_CANVAS_RELEASE_BASE_URL,
# PULSE_CANVAS_DOWNLOAD_URL, PULSE_CANVAS_PAGES_PROJECT.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.1.80'
        required: true
      notes_zh:
        description: 'Chinese release notes'
        required: true
      notes_en:
        description: 'English release notes'
        required: true

permissions:
  contents: write

concurrency:
  group: canvas-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z, got: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: master

      # Fail before any upload if the tag exists: pushing it comes last.
      - name: Check tag is free
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/pulse-canvas-v$VERSION" >/dev/null; then
            echo "Tag pulse-canvas-v$VERSION already exists." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A global CLI for the runner, not a workspace dependency; npm's global
      # bin is already on PATH after setup-node.
      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Set git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Notes come in through env, never shell interpolation of inputs.
      # --commit-tag commits the version bump and tags it on the runner only.
      - name: Package, upload, deploy and tag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULSE_CANVAS_R2_BUCKET: ${{ secrets.PULSE_CANVAS_R2_BUCKET }}
          PULSE_CANVAS_RELEASE_BASE_URL: ${{ secrets.PULSE_CANVAS_RELEASE_BASE_URL }}
          PULSE_CANVAS_DOWNLOAD_URL: ${{ secrets.PULSE_CANVAS_DOWNLOAD_URL }}
          PULSE_CANVAS_PAGES_PROJECT: ${{ secrets.PULSE_CANVAS_PAGES_PROJECT }}
          PULSE_CANVAS_RELEASE_NOTES_ZH: ${{ inputs.notes_zh }}
          PULSE_CANVAS_RELEASE_NOTES_EN: ${{ inputs.notes_en }}
        run: |
          node apps/canvas-workspace/harness/skills/pulse-canvas-release/scripts/release-pulse-canvas.mjs \
            --version "$VERSION" --commit-tag

      - name: Push release tag
        run: git push origin "pulse-canvas-v$VERSION"
