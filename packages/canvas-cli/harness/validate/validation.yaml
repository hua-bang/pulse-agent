version: 1

pathRules:
  - name: default
    paths:
      - src/**
      - skills/**
      - package.json
      - tsconfig.json
      - tsup.config.ts
    required:
      - pnpm --filter @pulse-coder/canvas-cli test
      - pnpm --filter @pulse-coder/canvas-cli typecheck

  - name: executable-bundle
    paths:
      - package.json
      - tsup.config.ts
      - scripts/**
    required:
      - pnpm --filter @pulse-coder/canvas-cli exec vitest run scripts/prepare-native.test.mjs
      - pnpm --filter @pulse-coder/canvas-cli build

  # `pulse-canvas mcp` tool surface, node projection, and the agent plugin
  # package. The node view itself is built and E2E-checked by
  # apps/canvas-workspace (rule `mcp-node-view`).
  - name: mcp-server
    paths:
      - src/mcp/**
      - src/core/apply.ts
      - src/core/nodes.ts
    required:
      - pnpm --filter @pulse-coder/canvas-cli exec vitest run src/mcp/__tests__/server.test.ts src/mcp/__tests__/plugin-package.test.ts src/core/__tests__/apply.test.ts
