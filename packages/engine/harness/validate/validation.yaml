version: 1

pathRules:
  - name: default
    paths:
      - src/**
      - package.json
      - tsconfig.json
      - tsup.config.ts
    required:
      - pnpm --filter pulse-coder-engine test
      - pnpm --filter pulse-coder-engine typecheck
  - name: plugin-registry-parity
    # describe-engine hard-errors (--json exit 1) on a dangling plugin
    # dependency — a plugin declaring a by-NAME dependency on an unregistered
    # plugin, which aborts Engine construction at runtime. The descriptor
    # reads dist, so rebuild in the same step and stop if that build fails.
    # Independent runner steps continue after failure; separate commands
    # would allow the descriptor to inspect stale or incomplete output.
    paths:
      - src/built-in/**
      - src/tools/index.ts
    required:
      - pnpm --filter pulse-coder-engine build && node packages/engine/harness/tools/describe-engine.mjs --json
