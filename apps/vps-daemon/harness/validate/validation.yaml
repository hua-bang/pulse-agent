version: 1

pathRules:
  - name: default
    paths:
      - src/**
      - package.json
      - tsconfig.json
      - tsup.config.ts
    required:
      - pnpm --filter @pulse-coder/vps-daemon typecheck
      - pnpm --filter @pulse-coder/vps-daemon test
      - pnpm --filter @pulse-coder/vps-daemon build
