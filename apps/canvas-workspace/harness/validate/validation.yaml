version: 1

pathRules:
  - name: default
    paths:
      - src/**
      - package.json
      - vitest.config.ts
      - tsconfig.json
      - tsconfig.node.json
      - electron.vite.config.ts
    quick:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/main/__tests__/ui-reuse-governance.test.ts src/main/__tests__/file-size-governance.test.ts
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace test

  # Renderer module architecture is a planned, migration-aware target. The
  # detector reports current pressure without failing default mode; its own
  # specs pin folder classification and dependency-direction semantics.
  - name: renderer-structure-health
    paths:
      - harness/spec/renderer-modules/**
      - harness/skills/check-renderer-structure/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run harness/skills/check-renderer-structure/scripts/check-renderer-structure.test.mjs
      - node apps/canvas-workspace/harness/skills/check-renderer-structure/scripts/check-renderer-structure.mjs --json
    required:
      - pnpm --filter canvas-workspace exec vitest run harness/skills/check-renderer-structure/scripts/check-renderer-structure.test.mjs
      - node apps/canvas-workspace/harness/skills/check-renderer-structure/scripts/check-renderer-structure.mjs --json

  # Canvas document state is a data-integrity seam: nodes+edges history,
  # external CLI merge, persistence scheduling, and content side effects must
  # stay coherent through the public modules/canvas interface.
  - name: canvas-document
    paths:
      - src/renderer/src/modules/canvas/**
      - src/renderer/src/modules/canvas/components/canvas/Canvas/**
    quick:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/canvas/document src/renderer/src/modules/canvas/components/canvas/Canvas
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace test

  # Agent Plugins is a cross-process contract: strict package ingestion in
  # main, persisted registration, generated MCP config, preload IPC, and the
  # renderer market must move together. This rule pins the focused suite while
  # the default rule continues to own the full Canvas test gate.
  - name: agent-plugin-market
    paths:
      - src/main/plugin-market/**
      - src/main/agent/engine-plugins.ts
      - src/main/plugin-market/config.ts
      - src/shared/plugin-market.ts
      - src/preload/bridge/plugin-market.ts
      - src/renderer/src/modules/plugin-market/**
      - src/renderer/src/modules/skills/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/main/plugin-market src/renderer/src/modules/plugin-market src/renderer/src/modules/skills
      - pnpm --filter canvas-workspace typecheck
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace test
      - node apps/canvas-workspace/harness/tools/describe-canvas.mjs

  # Conversation-runtime: per-conversation run state (main registry/service/
  # IPC + renderer store + keyed stream hooks). The default rule's full-suite
  # run already covers these; this rule pins the fast targeted suites so a
  # change to the conversation layer is verified without a full test pass.
  - name: conversation-runtime
    paths:
      - src/main/agent/conversation-runtime/**
      - src/shared/conversation-runtime.ts
      - src/renderer/src/modules/chat/runtime/**
      - src/renderer/src/modules/chat/components/ChatComposer/useChatComposerController.ts
      - src/renderer/src/modules/chat/components/ChatPanel/index.tsx
      - src/renderer/src/modules/chat/components/ChatPageBody/index.tsx
      - harness/mock-llm.mjs
      - harness/mock-llm.test.mjs
    quick:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/shared/conversation-runtime.test.ts src/main/agent/conversation-runtime src/renderer/src/modules/chat/runtime/conversationStore.test.ts src/renderer/src/modules/chat/runtime/useConversationRuntimeStream.test.tsx src/renderer/src/modules/chat/runtime/useConversationRuntimeStream.shared-snapshot.test.tsx src/renderer/src/modules/chat/components/ChatComposer/__tests__/useChatComposerController.test.tsx harness/mock-llm.test.mjs
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace test

  # The headless Electron driver (harness Tool face) carries its own vitest
  # suite (harness/tools/driver/src/__tests__/headless.test.mjs), picked up by
  # the default vitest include. Without this rule a cdp/launch/session change
  # triggers nothing.
  - name: product-harness
    paths:
      - harness/tools/driver/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run harness/tools/driver/src/__tests__
    required:
      - pnpm --filter canvas-workspace test
    manual:
      - pnpm --filter canvas-workspace harness start --profile demo --reset --force --enable-webview-page-control --json
      - pnpm --filter canvas-workspace harness verify-webview-input-focus --json
      - pnpm --filter canvas-workspace harness close --cleanup --json

  # Keyboard shortcuts are a cross-layer contract: bindings in
  # shortcuts/registry, canvas + app handler tables, the lazy help overlay and
  # palette labels derived from them, the webview forwarding whitelist in
  # shared/, and the terminal key arbitration. Typecheck already catches a
  # documented-but-unimplemented shortcut (the handler tables are exhaustive
  # by type); these suites cover the runtime halves — exact-modifier
  # matching, auto-repeat, Escape ownership, clipboard recency, and whether a
  # terminal-scoped chord actually CLAIMS the key instead of also firing the
  # global binding it shares.
  # The xterm surfaces are listed because each one dispatches terminal-owned
  # shortcuts from its custom key handler.
  - name: keyboard-shortcuts
    paths:
      - src/renderer/src/shortcuts/**
      - src/renderer/src/modules/canvas/runtime/useCanvasKeyboard.ts
      - src/renderer/src/app/shortcuts/useAppShortcuts.ts
      - src/renderer/src/hooks/useWebviewShortcutBridge.ts
      - src/renderer/src/utils/keyboardShortcut.ts
      - src/renderer/src/app/shell/AppShellProvider/ShortcutsDialog.tsx
      - src/shared/webview-shortcuts.ts
      - src/main/webview/shortcut-forwarding.ts
      - src/main/app/menu.ts
      - src/renderer/src/modules/coding-agent/components/AgentNodeBody/utils/terminal.ts
      - src/renderer/src/modules/coding-agent/components/AgentNodeBody/utils/terminalFocus.ts
      - src/renderer/src/modules/coding-agent/components/AgentNodeBody/useAgentNodeController.ts
      - src/renderer/src/modules/canvas/components/node-bodies/TerminalNodeBody/index.tsx
      - src/renderer/src/modules/dock/internal/WorkspaceTerminalDock/index.tsx
      - src/renderer/src/modules/node-mentions/components/NodeMentionPicker/index.tsx
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/shortcuts src/renderer/src/modules/canvas/runtime/useCanvasKeyboard.test.ts src/renderer/src/app/shortcuts/useAppShortcuts.test.ts src/main/webview/__tests__/shortcut-forwarding.test.ts src/renderer/src/modules/coding-agent/components/AgentNodeBody/utils/terminalKeys.test.ts src/renderer/src/modules/coding-agent/components/AgentNodeBody/utils/terminalFocus.test.ts
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/shortcuts src/renderer/src/modules/canvas/runtime/useCanvasKeyboard.test.ts src/renderer/src/app/shortcuts/useAppShortcuts.test.ts src/main/webview/__tests__/shortcut-forwarding.test.ts src/renderer/src/modules/coding-agent/components/AgentNodeBody/utils/terminalKeys.test.ts src/renderer/src/modules/coding-agent/components/AgentNodeBody/utils/terminalFocus.test.ts

  # The Coding Agent node's CLI roster is a cross-file contract: one registry
  # entry, but a usable agent also needs a brand mark, a dock identity, a
  # command-detection arm, and — the part with no compile-time guard — its own
  # session-binding rule, which decides whether "Resume" is offered and which
  # conversation it reaches. Getting that wrong attaches a node to someone
  # else's conversation, silently.
  # Knowledge: harness/knowledge/coding-agent-registry.md.
  - name: coding-agent-roster
    paths:
      - src/renderer/src/config/agentRegistry.ts
      - src/renderer/src/modules/coding-agent/**
      - src/renderer/src/utils/codingAgentCommand.ts
      - src/renderer/src/modules/dock/internal/RightDock/DockAgentTabIcon.tsx
      - src/main/agent/codex-sessions.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/coding-agent src/renderer/src/utils/__tests__/codingAgentCommand.test.ts src/renderer/src/modules/dock/internal/RightDock/__tests__/DockTabIcon.test.tsx src/main/__tests__/codex-sessions.test.ts
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/coding-agent src/renderer/src/utils/__tests__/codingAgentCommand.test.ts src/renderer/src/modules/dock/internal/RightDock/__tests__/DockTabIcon.test.tsx src/main/__tests__/codex-sessions.test.ts

  - name: agent-team-workspace
    paths:
      - src/renderer/src/modules/agent-team/**
      - src/main/agent-teams/**
      - src/shared/agent-teams.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/agent-team
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/agent-team src/main/agent-teams

  - name: workspace-nodes
    paths:
      - src/renderer/src/modules/workspace-nodes/**
      - src/main/workspace-nodes/**
      - src/shared/canvas.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/workspace-nodes
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/workspace-nodes src/main/workspace-nodes

  - name: mcp-apps
    paths:
      - src/renderer/src/modules/mcp-apps/**
      - src/shared/mcp-apps.ts
      - src/main/agent/mcp-apps.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/mcp-apps
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/mcp-apps src/main/agent/mcp-apps.test.ts

  - name: model-selection
    paths:
      - src/renderer/src/modules/models/**
      - src/renderer/src/utils/modelCatalog.ts
      - src/renderer/src/types/models.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/models
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/models

  - name: renderer-settings
    paths:
      - src/renderer/src/modules/settings/**
      - src/renderer/src/shared/roleLibraryEvents.ts
      - src/main/settings/**
      - src/preload/bridge/settings.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/settings src/renderer/src/modules/chat/mentions/roleMentionItems.test.ts
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/settings src/renderer/src/modules/chat/mentions/roleMentionItems.test.ts src/main/settings

  - name: renderer-dock
    paths:
      - src/renderer/src/modules/dock/**
      - src/renderer/src/shared/dockPort.tsx
      - src/renderer/src/shared/dockTypes.ts
      - src/renderer/src/shared/dock/**
      - src/renderer/src/platform/browser/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/dock src/renderer/src/shared/dock src/renderer/src/platform/browser
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/dock src/renderer/src/shared/dock src/renderer/src/platform/browser

  - name: scheduled-tasks
    paths:
      - src/renderer/src/modules/scheduled/**
      - src/shared/scheduled.ts
      - src/main/scheduled/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/scheduled
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/scheduled src/main/scheduled

  - name: artifacts
    paths:
      - src/renderer/src/modules/artifacts/**
      - src/main/artifacts/**
      - src/shared/artifact-capabilities.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/chat/components/__tests__/ChatRichToolResults.test.ts src/main/artifacts
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/chat/components/__tests__/ChatRichToolResults.test.ts src/main/artifacts

  - name: note-editor
    paths:
      - src/renderer/src/modules/note-editor/**
      - src/renderer/src/shared/fileNodeEditorRegistry.tsx
      - src/renderer/src/modules/canvas/runtime/useCanvasSearch.ts
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/note-editor src/renderer/src/modules/canvas/components/node-bodies/FileNodeBody
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/renderer/src/modules/note-editor src/renderer/src/modules/canvas/components/node-bodies/FileNodeBody

  # Static source-of-truth checks for the app's agent-tool registry, IPC
  # handle/invoke pairs, canvas node union/factory, and storage schema parity.
  # The canvas-cli mirror paths are bound by the root validation overlay.
  - name: canvas-contract-snapshot
    paths:
      - src/main/**
      - src/plugins/main/**
      - src/preload/**
      - src/shared/canvas.ts
      - src/renderer/src/utils/nodeFactory.ts
      - harness/tools/describe-canvas.mjs
    required:
      - node apps/canvas-workspace/harness/tools/describe-canvas.mjs

  # pi's package metadata currently asks for Node >=22.19 while Electron 30
  # embeds Node 20.16. Keep both ordinary adapter checks and a real Electron
  # main-process prompt available as explicit compatibility evidence.
  - name: pi-agent-harness-runtime
    paths:
      - package.json
      - src/main/agent/backends/pi-*
      - src/main/agent/model/config.ts
      - harness/tools/pi-agent-harness-smoke/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/main/agent/backends/pi-agent-harness-backend.test.ts src/main/agent/backends/pi-model-adapter.test.ts src/main/agent/backends/pi-tool-adapter.test.ts
      - pnpm --filter canvas-workspace typecheck:main
    required:
      - pnpm --filter canvas-workspace build
      - pnpm --filter canvas-workspace smoke:pi-electron

  - name: packaged-agent-tooling
    paths:
      - package.json
      - src/main/files/agent-tooling-manager.ts
      - src/main/files/agent-tooling-manager.test.ts
      - src/main/files/agent-tooling-files.ts
      - src/main/files/agent-tooling-deployment.ts
      - src/main/files/agent-tooling-queue.ts
      - src/main/files/agent-tooling-queue.test.ts
      - src/main/files/agent-tooling-state.ts
      - src/main/files/skill-installer.ts
      - src/main/files/shell-path.ts
      - src/main/files/shell-path.test.ts
      - src/shared/settings-config.ts
      - src/preload/bridge/settings.ts
      - src/renderer/src/modules/settings/internal/Settings/AgentSection.tsx
      - src/renderer/src/modules/settings/internal/Settings/AgentShellPathCard.tsx
      - src/renderer/src/modules/settings/internal/Settings/AgentSection.css
      - src/main/__tests__/agent-tooling-package.test.ts
      - harness/tools/smoke-packaged-agent-tooling.mjs
    quick:
      - pnpm --filter canvas-workspace exec vitest run src/main/files/agent-tooling-manager.test.ts src/main/files/agent-tooling-queue.test.ts src/main/files/shell-path.test.ts src/main/__tests__/agent-tooling-package.test.ts
    required:
      - pnpm --filter canvas-workspace typecheck
      - pnpm --filter canvas-workspace exec vitest run src/main/files/agent-tooling-manager.test.ts src/main/files/agent-tooling-queue.test.ts src/main/files/shell-path.test.ts src/main/__tests__/agent-tooling-package.test.ts
    manual:
      - pnpm --filter canvas-workspace package:mac:arm64 && node apps/canvas-workspace/harness/tools/smoke-packaged-agent-tooling.mjs

  # This plain-React visual fixture has an isolated tsconfig and Linux-only
  # screenshot baselines, so keep typechecking automatic and the pixel check
  # explicit until a suitable Linux runner owns it.
  - name: ui-showcase
    paths:
      - harness/tools/ui-showcase/**
    required:
      - pnpm --filter canvas-workspace exec tsc --noEmit -p harness/tools/ui-showcase/tsconfig.json
    manual:
      - pnpm --filter canvas-workspace visual

  - name: performance-unit
    paths:
      - perf/**
      - scripts/perf/**
    quick:
      - pnpm --filter canvas-workspace exec vitest run scripts/perf

  # Bundle + runtime perf gates (perf/program.md). CI runs the bundle gate on
  # every canvas-workspace PR and reserves this full report for sensitive
  # paths, explicit performance labeling, manual runs, and default-branch
  # pushes. Locally it remains release-level evidence.
  - name: performance-sensitive
    paths:
      - src/**
      - electron.vite.config.ts
      - perf/**
      - scripts/perf/**
    release:
      - pnpm --filter canvas-workspace perf:report
    manual:
      - pnpm --filter canvas-workspace perf:webview-load:ab
